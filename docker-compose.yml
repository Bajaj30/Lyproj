# PrescriptAI — local production run.  docker compose up --build -d
#   -> http://localhost:8000   (UI + API on one origin)
#
# Bound to 127.0.0.1 only: the site stores patient photographs and doctor
# accounts are not vetted yet, so it must not be reachable from the network.
services:
  prescriptai:
    build: .
    image: prescriptai:local
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env.docker          # SECRET_KEY; gitignored, see README
    environment:
      # auto: the mock reader until ANTHROPIC_API_KEY is set in .env.docker,
      # then Claude. Empty key = no spend; the UI shows "Demo reader".
      READER: auto
      PUBLIC_BASE_URL: http://localhost:8000   # what the PDF's QR opens
      PRESCRIPTAI_SPEND_CAP: "5"   # .env is not copied in; keep the same cap
      COOKIE_SECURE: "false"       # plain http on localhost
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DEBUG: "false"
      # Prototype mail: every code (email AND phone) goes to Mailpit, an
      # open-source catch-all inbox. Read it at http://localhost:8025.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_FROM: no-reply@prescriptai.local
      SMS_DELIVERY: email
      DEMO_INBOX_URL: http://localhost:8025
    depends_on: [mailpit]
    volumes:
      # The two medicine CSVs (gitignored; README §9). Put them in this folder
      # on the host: no rebuild needed, and they never enter the image.
      - ./ml_pipeline/data/india:/app/ml_pipeline/data/india:ro
      - prescriptai_data:/app/data                    # SQLite
      - prescriptai_uploads:/app/backend/uploads      # prescription images
      - prescriptai_cache:/app/ml_pipeline/.cache     # read cache + spend ledger
    restart: unless-stopped

  # Local test inbox. Accepts mail for ANY address and delivers none of it
  # onward, so codes never leave this machine. Web UI on 8025; SMTP stays on
  # the compose network.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ["127.0.0.1:8025:8025"]
    environment:
      MP_MAX_MESSAGES: "500"
    restart: unless-stopped

volumes:
  prescriptai_data:
  prescriptai_uploads:
  prescriptai_cache:
