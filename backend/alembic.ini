# Alembic configuration, for the command line only:
#
#   cd backend
#   alembic revision --autogenerate -m "add X to Y"    # after changing a model
#   alembic upgrade head                                # apply (startup does this too)
#   alembic history
#
# The database URL is NOT set here: migrations/env.py takes it from
# config/settings.py (DATABASE_URL), the same place the app does.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = [DB] %(message)s
